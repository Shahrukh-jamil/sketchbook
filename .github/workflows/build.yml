name: Build SketchBook APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure Persistent Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -f "app/release-key.jks" ]; then
            echo "Using persistent repository keystore app/release-key.jks"
          elif [ -n "$KEYSTORE_BASE64" ]; then
            python3 -c "
          import os, base64
          raw = os.environ.get('KEYSTORE_BASE64', '').strip().replace('\n', '').replace('\r', '').replace(' ', '')
          pad = len(raw) % 4
          if pad: raw += '=' * (4 - pad)
          with open('app/release-key.jks', 'wb') as f: f.write(base64.b64decode(raw))
          "
          else
            keytool -genkeypair -v -keystore app/release-key.jks -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=SketchBookOSS, OU=Dev, O=OSS, L=City, S=State, C=US"
          fi

      - name: Build Release APK
        run: gradle assembleRelease

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SketchBook-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
